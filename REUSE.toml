version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on GitHub and npm) or which can not carry a comment.
[[annotations]]
path = [
    "AUTHORS",
    "README.md",
    ".idea/**",
    "testgen/*.egg-info/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-typescript AUTHORS"
SPDX-License-Identifier = "MIT"

# JSON configuration and lock files can not carry a comment.
[[annotations]]
path = [
    "package.json",
    "package-lock.json",
    "tsconfig.json",
    ".prettierrc",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-typescript AUTHORS"
SPDX-License-Identifier = "MIT"

# The test data is generated by aas-core3.0rc02-testgen and copied over
# verbatim, and JSON can not carry a comment.
[[annotations]]
path = "test_data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 aas-core3.0rc02-typescript AUTHORS"
SPDX-License-Identifier = "MIT"
